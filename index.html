<!DOCTYPE html>
<HTML langue="fr">
<tête>
  <méta jeu de caractères="UTF-8">
  <méta nom="fenêtre d'affichage" contenu="largeur=largeur de l'appareil, échelle=1.0">
  <titre>VidDown PRO</titre>
  <style>
    corps{marge: 0;famille de polices: 'Segoe UI',Arial,sans empattement;arrière-plan: #161b2e;}

    /* Barre de recherche du haut */
    en-tête{arrière-plan: #161b2e;rembourrage: 15px;afficher:fléchir;écart: 10px;}
    .barre de recherche{fléchir: 1;afficher:fléchir;arrière-plan: #202742;rayon de bordure: 8px;}
    .barre de recherche saisir{fléchir: 1;arrière-plan:aucun;frontière:aucun;rembourrage: 10px;couleur:blanc;}
    .recherche par bouton{arrière-plan: #6c63ff;frontière:aucun;couleur:blanc;rembourrage: 10px 15px;rayon de bordure: 0 8px 8px 0;}

    .récipient{rembourrage: 15px;}

    /* Grille des raccourcis réseaux sociaux */
    h3{marge: 15px 5px 10px 5px;taille de police: 16px;couleur: #b0b3c6;police-weight: bold;}
    .applications de grille{afficher:grille;colonnes du modèle de grille: répéter(4, 1fr);écart: 15px;}
    .élément d'application{afficher:fléchir;direction flexible:colonne;aligner les éléments: centre;curseur: pointeur;}
    .icône d'application{largeur: 55px;hauteur: 55px;rayon de bordure: 50%;afficher: fléchir;aligner les éléments: centre;justifier le contenu: centre;taille de police: 24px;couleur: blanc;boîte-ombre: 0 4px 6px rgba(0,0,0,0.1);}

    /* Couleurs des icônes */
    .yt{arrière-plan: #ff0000; }
    .Washington{arrière-plan: #25d366; }
    .Facebook{arrière-plan: #1877f2; }
    .tt{arrière-plan: #000000;frontière: 1pxsolide#333; }

    /* Zone des résultats et téléchargement */
    .carte{arrière-plan: #161b2e;rembourrage: 20px;rayon de bordure: 15px;afficher: aucune;boîte-ombre: 0 10px 25px rgba(0,0,0,0.3);marge-inférieure: 20px;frontière: 1px solide #2d385e;}
    .statut{marge inférieure: 12px;taille de police: 14px;couleur: #00e5ff;police-weight: bold;texte-aligner: centre;}
    .rangée{afficher:fléchir;écart: 10px; }
    .bouton-dl{fléchir: 1;rembourrage: 12px;rayon de bordure: 10px;couleur:blanc;frontière:aucun;police-weight:bold;curseur:pointeur;afficher:fléchir;aligner-éléments:centre;justifier-contenu:centre;écart:8px;taille-police:14px;transition: transformation 0.2s;}
    .musique{arrière-plan: gradient linéaire(45deg, #ff9800, #ff5722); }
    .vidéo{arrière-plan: gradient linéaire(45deg, #00ebff, #0072ff); }

    /* Suggestions de vidéos (style fil d'actualité) */
    .alimentation{marge supérieure: 20px; }
    .carte vidéo{arrière-plan: #161b2e;rayon de bordure: 12px;marge inférieure: 15px;débordement: caché;boîte-ombre: 0 4px 8px rgba(0,0,0,0.2);frontière: 1px solide #202742;}
    .vignette{largeur: 100%;hauteur: 180px;arrière-plan: #202742;afficher:fléchir;aligner-éléments:centre;justifier-contenu:centre;position: relative;}
    .bouton de lecture{position: absolu;arrière-plan: rgba(108, 99, 255, 0.9);largeur: 50px;hauteur: 50px;rayon de bordure: 50%;afficher:fléchir;aligner-éléments:centre;justifier-contenu:centre;couleur:blanc;taille-police:20px;}
    .infos vidéo{rembourrage: 12px; }
    .titre de la vidéo{taille de police: 14px;police-weight:audacieux;marge inférieure: 4px;couleur: blanc;}
    .auteur vidéo{taille de police: 12px;couleur: #a0a5c1; }
  </style>
</tête>
<corps>

  <div class="en-tête">
    <div class="barre de recherche">
      <input type="text" id="urlInput" placeholder="Collez le lien de la vidéo ici...">
    </div>
    <button class="recherche par bouton" onclick="traiterRecherche()">Rechercher</button>
  </div>

  <div class="récipient">
    <h3>Raccourcis</h3>
    <div class="applications de grille">
      <div class="élément d'application" onclick="ouvrirReseau('https://www.youtube.com')">
        <div class="icône d'application yt">YT</div>
      </div>
      <div class="élément d'application" onclick="ouvrirReseau('https://www.facebook.com')">
        <div class="icône d'application Facebook">FB</div>
      </div>
      <div class="élément d'application" onclick="ouvrirReseau('https://www.tiktok.com')">
        <div class="icône d'application tt">TT</div>
      </div>
    </div>

    <div class="carte" id="downloadCard">
      <div class="statut" id="statusText">Vidéo détectée ! Prêt au téléchargement</div>
      <div class="rangée">
        <a id="btnAudio" href="#" target="_blank" class="bouton-dl musique">Télécharger MP3</a>
        <a id="btnVideo" href="#" target="_blank" class="bouton-dl vidéo">Télécharger MP4</a>
      </div>
    </div>

    <h3>Vidéos Populaires</h3>
    <div class="alimentation">
      <div class="carte vidéo">
        <div class="vignette">
          <div class="bouton de lecture">▶</div>
        </div>
        <div class="infos vidéo">
          <div class="titre de la vidéo">Nouveau Clip Officiel 2026 (Exclusivité)</div>
          <div class="auteur vidéo">Chaîne Musique • 2,5 M de vues</div>
        </div>
      </div>
      <div class="carte vidéo">
        <div class="vignette">
          <div class="bouton de lecture">▶</div>
        </div>
        <div class="infos vidéo">
          <div class="titre de la vidéo">Film d'Action Complet en Français HD</div>
          <div class="auteur vidéo">Cinéma Box • 898 k vues</div>
        </div>
      </div>
    </div>
  </div>

<script>
function traiterRecherche() {
  let saisie = document.getElementById("urlInput").value.trim();
  if(!saisie) return;

  if(saisie.includes("youtu.be") || saisie.includes("youtube.com")) {
    let idVideo = extractVideoId(saisie);
    if(idVideo) {
      document.getElementById("btnAudio").href = "https://www.y2mate.com/fr/youtube-mp3/" + idVideo;
      document.getElementById("btnVideo").href = "https://www.y2mate.com/fr/youtube/" + idVideo;
      document.getElementById("downloadCard").style.display = "block";
      return;
    }
  }
  window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(saisie));
}

function ouvrirReseau(url) {
  window.open(url, "_blank");
}

function extractVideoId(url) {
  let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
  let match = url.match(regExp);
  return (match && match[2].length == 11) ? match[2] : "";
}
</script>

<script>
  const injectStyles = () => {
    const style = document.createElement('style');
    style.innerHTML = `
      ytd-masthead, 
      #header-bar, 
      .header-barrier, 
      yt-header-renderer, 
      #yt-masthead-container { 
        display: none !important; 
      }
    `;
    document.head.appendChild(style);
  };

  window.addEventListener('DOMContentLoaded', injectStyles);
  window.addEventListener('load', injectStyles);
</script>

</corps>
  </HTML>
