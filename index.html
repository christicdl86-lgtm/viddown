DOCTYPE html>  <html lang="fr">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>VidDown - Téléchargez Musique & Vidéos</title>  <style>  
* { margin:0; padding:0; box-sizing:border-box; }  
  
:root {  
  --primary:#6c63ff;  
  --secondary:#ff6584;  
  --dark:#1a1a2e;  
  --card:#16213e;  
  --text:#e0e0e0;  
  --gold:#ffd700;  
}  
  
body {  
  background: var(--dark);  
  color: var(--text);  
  font-family: 'Segoe UI', sans-serif;  
  min-height: 100vh;  
}  
  
/* NAV */  
nav {  
  background: linear-gradient(135deg, #6c63ff, #a855f7);  
  padding: 0 20px;  
  display: flex;  
  justify-content: space-between;  
  align-items: center;  
  height: 60px;  
  position: sticky;  
  top: 0;  
}  
  
.logo {  
  color: white;  
  font-weight: 800;  
}  
  
.btn-fetch {  
  background: linear-gradient(135deg, #6c63ff, #a855f7);  
  color: white;  
  border: none;  
  padding: 14px 24px;  
  border-radius: 10px;  
  cursor: pointer;  
}  
  
/* INPUT */  
.search-box {  
  max-width: 700px;  
  margin: 50px auto;  
  padding: 20px;  
}  
  
.input-row {  
  display: flex;  
  gap: 10px;  
}  
  
.url-input {  
  flex: 1;  
  padding: 14px;  
  border-radius: 10px;  
  border: 1px solid #333;  
  background: #111;  
  color: white;  
}  
  
/* VIDEO INFO */  
.video-info {  
  max-width: 700px;  
  margin: 20px auto;  
  background: var(--card);  
  border-radius: 16px;  
  padding: 16px;  
  display: none;  
}  
  
.video-title {  
  font-weight: bold;  
  margin: 10px 0;  
}  
  
.download-btns {  
  display: flex;  
  gap: 10px;  
}  
  
.download-btn {  
  flex: 1;  
  text-align: center;  
  padding: 10px;  
  border-radius: 10px;  
  background: linear-gradient(135deg, #6c63ff, #ff6584);  
  color: white;  
  text-decoration: none;  
}  
</style>  </head>  <body>  <nav>  
  <div class="logo">VidDown</div>  
</nav>  <div class="search-box">  
  <div class="input-row">  
    <input class="url-input" placeholder="Colle ton lien ici...">  
    <button class="btn-fetch">Télécharger</button>  
  </div>  
</div>  <div class="video-info"></div>  <script>  
const input = document.querySelector(".url-input");  
const btn = document.querySelector(".btn-fetch");  
const infoBox = document.querySelector(".video-info");  
  
btn.addEventListener("click", () => {  
  const url = input.value.trim();  
  
  if (!url) {  
    alert("Entre un lien valide !");  
    return;  
  }  
  
  btn.textContent = "Chargement...";  
  btn.disabled = true;  
  
  setTimeout(() => {  
    infoBox.style.display = "block";  
  
    infoBox.innerHTML = `  
      <div class="video-title">Vidéo détectée</div>  
      <div class="download-btns">  
      <a class="download-btn" href="https://exemple.com/video.mp4">MP4 720p</a> 
        <a class="download-btn" href="#">MP4 360p</a>  
        <a class="download-btn" href="#">MP3</a>  
      </div>  
    `;  
  
    btn.textContent = "Télécharger";  
    btn.disabled = false;  
  }, 1200);  
});  
</script>  </body>  
</html>.
