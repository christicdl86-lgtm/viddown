<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidDown PRO</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #0b0f1a; color: white; padding-bottom: 30px; }
  header { background: linear-gradient(45deg, #6c63ff, #00e5ff); padding: 20px; text-align: center; font-size: 22px; font-weight: bold; }
  .container { padding: 15px; }
  input { width: 100%; padding: 12px; border-radius: 10px; border: none; outline: none; margin-bottom: 10px; box-sizing: border-box; background: #151a2e; color: white; }
  button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #6c63ff; color: white; font-weight: bold; cursor: pointer; }
  .card { background: #151a2e; margin: 20px 0; padding: 20px; border-radius: 12px; display: none; text-align: center; }
  .row { display: flex; gap: 10px; margin-top: 15px; }
  .btn-dl { flex: 1; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; text-decoration: none; text-align: center; }
  .music { background: #ff9800; }
  .video { background: #03a9f4; }
  .status { margin-bottom: 10px; font-size: 14px; color: #b0b3c6; }
</style>
</head>
<body>

<header>VidDown PRO</header>

<div class="container">
  <input type="text" id="url" placeholder="Colle ton lien ici...">
  <button onclick="analyserLien()">Analyser le lien</button>

  <div class="card" id="resultCard">
    <div class="status" id="statusTxt">Lien prêt ! Choisissez votre format :</div>
    <div class="row">
      <a id="btnAudio" class="btn-dl music" href="#" target="_blank">Télécharger MP3</a>
      <a id="btnVideo" class="btn-dl video" href="#" target="_blank">Télécharger MP4</a>
    </div>
  </div>
</div>

<script>
function analyserLien() {
  let url = document.getElementById("url").value.trim();
  if(!url) {
    alert("Veuillez coller un lien d'abord !");
    return;
  }

  // Utilisation d'un service alternatif stable (y2mate) qui gère le téléchargement proprement
  let cleanUrl = encodeURIComponent(url);
  
  // Ces liens redirigent vers une plateforme de conversion en ligne ultra-stable
  document.getElementById("btnAudio").href = "https://www.y2mate.com/fr/youtube/" + extractVideoId(url);
  document.getElementById("btnVideo").href = "https://www.y2mate.com/fr/youtube/" + extractVideoId(url);
  
  document.getElementById("resultCard").style.display = "block";
}

function extractVideoId(url) {
  let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
  let match = url.match(regExp);
  return (match && match[2].length == 11) ? match[2] : "";
}
</script>

</body>
</html>
